</style></head><body>

 return{l,boss,mega,mods:m,lanes,sp,pat:l<12?0:Math.floor(R()*3),dens:Math.min(.35+l*.004+v*.1+(R()-.5)*.06,.8),gap:Math.max(.42,.62-l*.0022-v*.04+R()*.03,mx*.15),target,pm:l<60?0:Math.min(.12+(l-60)*.0009,.6),pm2:lanes===4&&l>=75?Math.min(.2+(l-75)*.0006,.5):0,time:m.includes('timed')?Math.ceil(target/(.7*sp)*1.5+6):0}}

 ui.innerHTML=`<h1>Twirlo</h1><p>💎 ${S.gems} · Level ${S.lv}/${MAXL} · Rank ${rk(S.xp||0)}</p><div class="xb"><div style="width:${pct(S.xp||0)}%"></div></div><button onclick="go(S.lv)">Play level ${S.lv}</button><button class="s" style="min-width:220px" onclick="levels()">All levels</button><button class="s" style="min-width:220px" onclick="go(0,true)">Daily challenge ${done?'✓':''} · 🔥${S.ds}</button><button class="s" style="min-width:220px" onclick="shop()">Shop</button><button class="s" style="min-width:220px" onclick="chests()">🎁 Chests · ⭐${S.sw}</button><button class="s" style="min-width:220px" onclick="help()">How to play</button><div class="row"><button class="s" onclick="settings()">🎵 Music &amp; sound</button><button class="s" onclick="S.noAds=true;save();menu()">${S.noAds?'Ads removed':'Remove ads $2.99 (demo)'}</button></div>`}

 THEMES.forEach((e,i)=>{if(e.chest&&!S.tOwn.includes(i))return;const ok=e.chest||S.lv>=e.un;h+=`<button class="s" ${ok?'':'disabled'} style="${S.theme===i?'outline:3px solid #fff':''}" onclick="S.theme=${i};save();shop()"><span style="color:${e.chest?RC[e.r]:'inherit'}">${e.n}</span>${ok?'':' (lvl '+e.un+')'}</button>`});
 SPIKES.forEach((e,i)=>{if(e.chest&&!S.sOwn.includes(i))return;k+=`<button class="s" style="${S.spike===i?'outline:3px solid #fff':''}" onclick="S.spike=${i};save();shop()">${e.i} <span style="color:${e.chest?RC[e.r]:'inherit'}">${e.n}</span></button>`});

function loop(now){const dt=Math.min((now-last)/1000,.05);last=now;t+=dt;
 if(state==='play'){if(surge>0)surge=Math.max(0,surge-dt);speed=Math.min(5.2,P.sp*(P.mods.includes('pulse')?1+.25*Math.sin(t*2):1)*(P.mods.includes('rush')?1+.55*Math.min(1,got/P.target):1)*(surge>0?.85:1));if(P.mods.includes('storm')&&Math.random()<.004)flash=.35;a+=speed*dt;r+=(lr(lane)-r)*Math.min(1,dt*22);inv-=dt;spawn();if(Math.random()<(surge>0?.9:.5)){const[sx,sy]=pos(a,r);parts.push({x:sx,y:sy,vx:(Math.random()-.5)*1.4,vy:(Math.random()-.5)*1.4,life:.8,dec:.05,s:3,c:surge>0?T().gem:beadCol()})}
  for(const o of obs){if(o.dead)continue;if(vis(o)&&Math.abs(o.a+sw()-a)<.1+o.w&&Math.abs(r-lr(o.l))<tol()){if(surge>0){o.dead=true;if(grab(o.a+sw(),o.l,T().bad))break}else if(inv<=0){die();break}}}

function draw(){const th=T(),live=state==='play'||state==='winfx'||state==='pause',sg=surge>0,gr=x.createRadialGradient(cx,cy,10,cx,cy,Math.max(W,H));gr.addColorStop(0,th.bg[0]);gr.addColorStop(1,th.bg[1]);x.fillStyle=gr;x.fillRect(0,0,W,H);if(live&&!cur.d){x.fillStyle='hsla('+(cur.l*47%360)+',70%,50%,.14)';x.fillRect(0,0,W,H)}

 x.save();if(shake>.5){x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.9}if(P.mods.includes('warp')&&live){x.translate(cx,cy);x.rotate(.26*Math.sin(t*.6));const z=1+.06*Math.sin(t*.9);x.scale(z,z);x.translate(-cx,-cy)}
 x.lineWidth=14;x.strokeStyle=sg?th.gem+'44':'#ffffff14';for(let i=0;i<P.lanes;i++){x.beginPath();x.arc(cx,cy,lr(i),0,7);x.stroke()}
 x.lineWidth=2;x.strokeStyle=sg?th.gem+'aa':'#ffffff44';x.setLineDash([5,16]);x.lineDashOffset=-(live?a:t)*40;for(let i=0;i<P.lanes;i++){x.beginPath();x.arc(cx,cy,lr(i),0,7);x.stroke()}x.setLineDash([]);

   x.fillStyle='rgba(255,255,255,.6)';x.beginPath();x.moveTo(0,-12);x.lineTo(-9,-3);x.lineTo(0,-3);x.closePath();x.fill();
   x.fillStyle='rgba(0,0,0,.22)';x.beginPath();x.moveTo(0,-3);x.lineTo(9,-3);x.lineTo(0,12);x.closePath();x.fill();if(q.dc){x.strokeStyle='#fff';x.lineWidth=2;x.beginPath();x.moveTo(-4,-4);x.lineTo(4,4);x.moveTo(4,-4);x.lineTo(-4,4);x.stroke()}x.restore();
   if(Math.sin(t*5+q.a*7)>.9){x.fillStyle='#fff';x.fillRect(px+5,py-11,2,6);x.fillRect(px+3,py-9,6,2)}}}
 if(state!=='over'){const rr=live?r:lr(P.lanes-1),aa=live?a:t*1.8,col=beadCol();
  x.globalCompositeOperation='lighter';for(let i=1;i<=10;i++){const[tx,ty]=pos(aa-i*.045,rr);x.globalAlpha=(inv>0?.3:1)*(.5-i*.045);x.fillStyle=sg?th.gem:col;x.beginPath();x.arc(tx,ty,15-i*1.1,0,7);x.fill()}x.globalCompositeOperation='source-over';
  const[bx,by]=pos(aa,rr);x.globalAlpha=inv>0&&Math.floor(t*12)%2?.4:1;

  const sh=x.createRadialGradient(bx-5,by-6,1,bx,by,17);sh.addColorStop(0,'rgba(255,255,255,.85)');sh.addColorStop(.35,'rgba(255,255,255,0)');sh.addColorStop(1,'rgba(0,0,0,.4)');x.fillStyle=sh;x.beginPath();x.arc(bx,by,15,0,7);x.fill();
  const ta=aa+Math.PI/2,ox=Math.cos(ta)*1.5,oy=Math.sin(ta)*1.5;x.fillStyle='#fff';x.beginPath();x.arc(bx-4,by-2,3.6,0,7);x.arc(bx+4,by-2,3.6,0,7);x.fill();x.fillStyle='#1b1033';x.beginPath();x.arc(bx-4+ox,by-2+oy,1.8,0,7);x.arc(bx+4+ox,by-2+oy,1.8,0,7);x.fill();x.globalAlpha=1}
 for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g||0;p.vx*=.985;p.life-=p.dec||.03;if(p.rot!==undefined)p.rot+=p.vr}
