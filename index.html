const MAXL=600,ADJ=['Sunny','Sprout','Wobbly','Neon','Glimmer','Storm','Ghost','Lava','Crystal','Cosmic'],NOUN=['Loop','Fields','Bay','Alley','Grotto','Orbit','Rings','Lanes','Spire','Zenith'];const wn=l=>{const w=Math.floor((l-1)/10);return ADJ[w%10]+' '+NOUN[Math.floor(w/10)%10]};

function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

 let n=l<10?0:l<30?1:l<80?1+(R()<.5?1:0):l<200?2:l<350?3:4;if(boss)n=Math.min(n+1,5);if(mega)n=Math.min(n+1,5);

 return{l,boss,mega,mods:m,lanes,sp,pat:l<12?0:Math.floor(R()*3),dens:Math.min(.35+l*.004+v*.1+(R()-.5)*.06,.8),gap:Math.max(.42,.62-l*.0022-v*.04+R()*.03,mx*.15),target,pm:l<60?0:Math.min(.12+(l-60)*.0012,.72),pm2:lanes===4&&l>=75?Math.min(.2+(l-75)*.0009,.6):0,time:m.includes('timed')?Math.ceil(target/(.7*sp)*1.5+6):0}}
